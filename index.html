<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dark Knight Disciples — DKD | Ronin Guild on SWG Uprising</title>
<meta name="description" content="Dark Knight Disciples (DKD) — a Ronin guild on Star Wars Galaxies Uprising. Join us on Discord.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;color:#e8e6f0;background:#05040a;overflow-x:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(5,4,10,.35),#05040a 80%),url(assets/hero.webp) center/cover no-repeat;filter:saturate(.8);z-index:-2}
@media (max-width:800px){.bg{background-image:radial-gradient(ellipse at center,rgba(5,4,10,.35),#05040a 80%),url(assets/hero-768.webp)}}
.stars{position:fixed;inset:0;z-index:-1;background-image:radial-gradient(1px 1px at 20% 30%,#fff8,transparent),radial-gradient(1px 1px at 70% 20%,#fff6,transparent),radial-gradient(1.5px 1.5px at 40% 80%,#fff5,transparent),radial-gradient(1px 1px at 85% 65%,#fff7,transparent);animation:tw 6s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.4}}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem}
.tag{letter-spacing:.5em;font-size:.8rem;color:#c33;text-transform:uppercase;margin-bottom:1rem}
h1{font-family:Cinzel,serif;font-weight:900;font-size:clamp(2.4rem,8vw,6rem);line-height:1;letter-spacing:.06em;background:linear-gradient(180deg,#fff,#9a96a8);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 40px rgba(200,30,30,.25)}
.saber{width:min(420px,70vw);height:4px;margin:1.6rem auto;border-radius:4px;background:#ff2a2a;box-shadow:0 0 8px #ff2a2a,0 0 24px #ff2a2a,0 0 48px #c00;animation:hum 2.5s ease-in-out infinite}
@keyframes hum{50%{box-shadow:0 0 6px #ff2a2a,0 0 16px #ff2a2a,0 0 30px #c00}}
p.sub{max-width:36rem;color:#b8b4c6;font-size:1.1rem;margin-bottom:2.6rem}
.join{display:inline-flex;align-items:center;gap:.9rem;padding:1.3rem 3rem;font-size:clamp(1.2rem,3vw,1.6rem);font-weight:600;color:#fff;text-decoration:none;border-radius:999px;background:linear-gradient(135deg,#5865F2,#3b43b8);box-shadow:0 0 0 1px #ffffff22,0 10px 40px rgba(88,101,242,.5);transition:transform .2s,box-shadow .2s}
.join:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 0 0 1px #fff4,0 14px 60px rgba(88,101,242,.8)}
.join svg{width:2rem;height:2rem;fill:#fff}
.ronin{font-family:Cinzel,serif;font-weight:600;letter-spacing:.8em;padding-left:.8em;font-size:clamp(1rem,2.5vw,1.4rem);color:#e33;margin-top:1.2rem;text-shadow:0 0 18px rgba(230,40,40,.5)}
.ronin .kanji{display:block;letter-spacing:.3em;padding-left:.3em;font-size:.8em;color:#8a2020;margin-top:.3rem;font-family:serif}
footer{position:fixed;bottom:1rem;width:100%;text-align:center;font-size:.75rem;color:#6d6980;letter-spacing:.2em}
</style>
</head>
<body>
<div class="bg"></div><div class="stars"></div>
<main>
  <div class="tag">Star Wars Galaxies · Uprising</div>
  <h1>Dark Knight<br>Disciples</h1>
  <div class="ronin">RONIN<span class="kanji">浪 人</span></div>
  <div class="saber"></div>
  <p class="sub">A Ronin guild on SWG Uprising. Once the Masterless Jedi of feudal Scylla, we have found a home once again. Walk the path with us.</p>
  <a class="join" href="https://discord.gg/tnCSB3jhyu" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.6 1.3a18.4 18.4 0 0 0-5.6 0L8.6 3a19.7 19.7 0 0 0-4.9 1.5C.6 9.1-.3 13.6.1 18a19.9 19.9 0 0 0 6 3l1.3-2a13 13 0 0 1-2-1l.5-.4a14.2 14.2 0 0 0 12.2 0l.5.4-2 1 1.3 2a19.8 19.8 0 0 0 6-3c.5-5.1-.8-9.6-3.6-13.6ZM8 15.3c-1.2 0-2.2-1.1-2.2-2.4S6.8 10.5 8 10.5s2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Zm8 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Z"/></svg>
    Join us on Discord
  </a>
</main>
<footer>DKD · RONIN · DARKKNIGHTDISCIPLES.COM</footer>
</body>
</html>
